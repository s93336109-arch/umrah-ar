<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>رحلتي إلى العمرة | واقع معزز</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
    #panel{position:fixed;top:env(safe-area-inset-top,0px);left:8px;right:8px;z-index:999999;text-align:center;background:rgba(255,255,255,.94);color:#07513e;border-radius:12px;padding:12px;box-sizing:border-box;pointer-events:none}
    h1{font-size:19px;margin:0 0 7px}
    p{font-size:13px;margin:0 0 5px}
    #status{font-size:12px;color:#444}
    #hint{position:fixed;bottom:14px;right:10px;left:10px;z-index:999999;text-align:center;background:rgba(255,255,255,.83);color:#333;padding:9px;border-radius:9px;font-size:12px;pointer-events:none}
  </style>
</head>
<body>
  <div id="panel">
    <h1>🕋 رحلتي إلى العمرة</h1>
    <p>وجّه الكاميرا نحو علامة Hiro</p>
    <div id="status">جارٍ تحميل مجسم الكعبة...</div>
  </div>
  <div id="hint">نختبر مجسم الكعبة أولًا، ثم نضيف المناسك الأربعة والحشود.</div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true" loading-screen="enabled: false">
    <a-marker preset="hiro" id="hiro">
      <a-entity id="kaaba" gltf-model="url(./kaaba_ready_for_codepen.glb)"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
  <script>
    const model = document.querySelector('#kaaba');
    const statusText = document.querySelector('#status');
    model.addEventListener('model-loaded', function () {
      const mesh = model.getObject3D('mesh');
      if (!mesh) { statusText.textContent='تم التحميل لكن المجسم غير ظاهر'; return; }
      mesh.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(mesh);
      const dimensions = bounds.getSize(new THREE.Vector3());
      const midpoint = bounds.getCenter(new THREE.Vector3());
      const longest = Math.max(dimensions.x,dimensions.y,dimensions.z);
      if (!Number.isFinite(longest) || longest <= 0) { statusText.textContent='تعذر تحديد أبعاد المجسم';return; }
      const s = 0.9 / longest;
      mesh.scale.multiplyScalar(s);
      mesh.position.set(-midpoint.x*s, -bounds.min.y*s, -midpoint.z*s);
      statusText.textContent='الكعبة جاهزة! وجّه الكاميرا نحو Hiro';
    });
    model.addEventListener('model-error', () => {statusText.textContent='تعذر تحميل مجسم الكعبة';});
  </script>
</body>
</html>
